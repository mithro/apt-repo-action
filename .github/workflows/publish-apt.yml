name: Publish signed APT repository to Pages

# Reusable workflow. Collects the .deb artifacts a caller's build jobs uploaded,
# indexes and signs one flat repository per suite, and deploys the result to
# GitHub Pages.
#
# Callers upload one artifact per (suite, arch) named `debs-<suite>-<arch>`;
# this workflow regroups them into apt-repo/<suite>/ before indexing.
# Architecture names contain no dashes, so everything before the LAST dash is
# the suite -- which may itself contain one (raspbian-trixie).
#
# Every name is derived from the repository name; see docs/conventions.md.
#
# Usage:
#   jobs:
#     publish:
#       needs: build
#       uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
#       with:
#         suites: "bookworm trixie sid"
#         architectures: "amd64 arm64 armhf riscv64"
#       secrets:
#         gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}

on:
  workflow_call:
    inputs:
      suites:
        description: Space-separated suites (e.g. "bookworm trixie sid").
        required: true
        type: string
      architectures:
        description: >-
          Space-separated architectures to advertise in Release. Use "all" for
          arch-independent packages. riscv64 is only official from trixie on.
        required: false
        default: all
        type: string
      origin:
        description: Deprecated; Origin/Label are the repository name.
        required: false
        default: ""
        type: string
      description:
        description: Human-readable description for Release.
        required: false
        default: ""
        type: string
      keyring-name:
        description: >-
          Deprecated; the key is published as <repo>.gpg (binary) and
          <repo>.asc (armoured).
        required: false
        default: ""
        type: string
      legacy-paths:
        description: >-
          Transitional. Space-separated paths of the repository's previous
          layout (".", "debian", "dists/bookworm", "usdr.gpg") to copy, frozen,
          from the live site into this deploy so clients configured the old way
          keep working while they are moved. See docs/conventions.md.
        required: false
        default: ""
        type: string
      artifact-pattern:
        description: Pattern matching the caller's deb artifacts.
        required: false
        default: "debs-*"
        type: string
    secrets:
      gpg-private-key:
        description: ASCII-armoured private signing key for this repository.
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: staging/

      - name: Regroup artifacts into apt-repo/<suite>/
        shell: bash
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          set -eux
          for suite in $SUITES; do mkdir -p "apt-repo/$suite"; done
          shopt -s nullglob
          for d in staging/*/; do
            name="$(basename "$d")"          # debs-<suite>-<arch>
            rest="${name#debs-}"
            suite="${rest%-*}"               # up to the last dash
            if [ ! -d "apt-repo/$suite" ]; then
              echo "::warning::artifact $name names suite '$suite' which is not in '$SUITES'; skipping"
              continue
            fi
            find "$d" -name '*.deb' -exec cp -v {} "apt-repo/$suite/" \;
          done
          ls -lR apt-repo/

      - name: Find the caller's index page fragment
        id: intro
        shell: bash
        run: |
          set -eu
          # Every index page comes from one template (docs/conventions.md); a
          # repository adds prose through packaging/apt-intro.html.
          for cand in packaging/apt-index.html docs/apt-index.html apt-index.html; do
            if [ -f "$cand" ]; then
              echo "::warning::$cand is ignored: index pages are generated. Move its description into packaging/apt-intro.html"
            fi
          done
          if [ -f packaging/apt-intro.html ]; then
            echo "path=packaging/apt-intro.html" >> "$GITHUB_OUTPUT"
          fi

      - id: pages
        uses: actions/configure-pages@v5

      # The action and scripts at the same commit as this workflow file, so a
      # caller pinned to a branch or SHA gets one consistent version of all
      # three. job.workflow_sha is the commit of the file defining this job.
      - name: Check out this workflow's own apt-repo-action
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .apt-repo-action

      - name: Index and sign
        uses: ./.apt-repo-action
        with:
          apt-root: apt-repo
          suites: ${{ inputs.suites }}
          architectures: ${{ inputs.architectures }}
          origin: ${{ inputs.origin }}
          description: ${{ inputs.description }}
          keyring-name: ${{ inputs.keyring-name }}
          site-url: ${{ steps.pages.outputs.base_url }}
          intro-html: ${{ steps.intro.outputs.path }}
          gpg-private-key: ${{ secrets.gpg-private-key }}

      - name: Keep serving the previous layout while clients move
        if: inputs.legacy-paths != ''
        shell: bash
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
          LEGACY_PATHS: ${{ inputs.legacy-paths }}
        run: |
          set -eu
          # shellcheck disable=SC2086 # word splitting is the point
          python3 .apt-repo-action/scripts/carry-over.py \
            --site "$SITE" --dest apt-repo $LEGACY_PATHS

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo/

      - id: deploy
        uses: actions/deploy-pages@v4
