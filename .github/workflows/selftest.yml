name: Self-test

# Publish a throwaway repository with THIS checkout of the action, then prove
# real apt clients can install from it. The action had no test at all, which
# is how every consuming repository came to serve a keyring apt refuses under
# gpgv. The client matrix covers both verifiers apt can use: bookworm, jammy
# and noble fall back to gpgv; trixie uses Sequoia's sqv.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deb-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: scripts/deb-version.py and scripts/apt-sources.py against docs/packaging.md
        run: python3 -m unittest discover -v -s tests -p 'test_*.py'

  build-deb:
    # Build a throwaway source tree with THIS checkout of build-deb and check
    # the version it stamped. On a pull request every build is a preview, so
    # ~pr<P> is expected there.
    name: build-deb (${{ matrix.suite }} ${{ matrix.arch }}${{ matrix.legacy && ' legacy' || '' }}${{ matrix.no-changelog && ' no-changelog' || '' }}${{ matrix.patch-series && ' patch-series' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: trixie, arch: all, want: "0.3.post1~deb13"}
          - {suite: sid, arch: amd64, want: "0.3.post1"}
          - {suite: bookworm, arch: arm64, want: "0.3.post1~deb12"}    # under QEMU
          - {suite: trixie, arch: armhf, want: "0.3.post1~deb13"}      # under QEMU
          # A repository still carrying its own packaging/deb-version.py
          # keeps using it (tmux, scanbd) until it is migrated.
          - {suite: trixie, arch: all, legacy: true, want: "9.9"}
          # Set B commits no debian/changelog: the build's entry is the only
          # one in the package (docs/packaging.md, "The changelog").
          - {suite: trixie, arch: all, no-changelog: true, want: "0.3.post1~deb13"}
          # A patch series builds in the fetched project's tree, versioned
          # from both (docs/packaging.md, "Versions"), with an epoch.
          - {suite: bookworm, arch: all, patch-series: true, want: "2:1.1.1.post2+selftest.0.3.post1~deb12"}
    steps:
      - uses: actions/checkout@v5

      - name: Make the fixture source tree
        run: >-
          python3 tests/make-source-fixture.py fixture-src
          ${{ matrix.legacy && '--legacy' || '' }}
          ${{ matrix.no-changelog && '--no-changelog' || '' }}
          ${{ matrix.patch-series && '--patch-series fixture-upstream' || '' }}

      - name: Build with this checkout of build-deb
        id: build
        uses: ./build-deb
        with:
          suite: ${{ matrix.suite }}
          arch: ${{ matrix.arch }}
          source-dir: ${{ matrix.patch-series && 'fixture-upstream' || 'fixture-src' }}
          version-tree: ${{ matrix.patch-series && 'fixture-src' || '' }}
          version-args: ${{ matrix.patch-series && '--owner-tag selftest --upstream-dir . --epoch 2' || '' }}

      - name: No declaration, so no dependency repositories
        env:
          APT_SOURCES: ${{ steps.build.outputs.apt-sources }}
        run: |
          set -eu
          test -z "$(cat "$APT_SOURCES/checks")"
          sh "$APT_SOURCES/install.sh" | grep -q 'no extra apt repositories'

      - name: lintian ran, and found the fixture's missing copyright file
        env:
          ERRORS: ${{ steps.build.outputs.lintian-errors }}
          WARNINGS: ${{ steps.build.outputs.lintian-warnings }}
        run: |
          set -eu
          echo "lintian: $ERRORS errors, $WARNINGS warnings"
          # The fixture has no debian/copyright: lintian's no-copyright-file.
          test "$ERRORS" -ge 1

      - name: Check the version and changelog
        env:
          WANT: ${{ matrix.want }}
          PR: ${{ github.event.pull_request.number }}
          LEGACY: ${{ matrix.legacy }}
          NO_CHANGELOG: ${{ matrix.no-changelog }}
          PATCH_SERIES: ${{ matrix.patch-series }}
        run: |
          set -eu
          if [ -n "$PR" ] && [ "$LEGACY" != true ]; then WANT="$WANT~pr$PR"; fi
          ls built-debs/
          got=$(dpkg-deb -f built-debs/apt-repo-selftest-src_*.deb Version)
          echo "version: $got (want $WANT)"
          test "$got" = "$WANT"
          if [ "$LEGACY" != true ]; then
            # A patch series' changelog is in the fetched tree; the commit
            # it names is still this repository's (the fixture's).
            log=fixture-src/debian/changelog
            if [ "$PATCH_SERIES" = true ]; then log=fixture-upstream/debian/changelog; fi
            sha=$(git -C fixture-src rev-parse HEAD)
            head -n 3 "$log"
            grep -qx "  \* Built from $GITHUB_REPOSITORY@$sha" "$log"
          fi
          if [ "$NO_CHANGELOG" = true ]; then
            # Nothing committed, so the package's changelog is the build's
            # one entry. A native package installs it as changelog.gz, a
            # non-native one as changelog.Debian.gz.
            dpkg-deb -x built-debs/apt-repo-selftest-src_*.deb deb-root
            doc=deb-root/usr/share/doc/apt-repo-selftest-src
            ls "$doc"
            log=$(ls "$doc"/changelog.Debian.gz "$doc"/changelog.gz || true)
            test "$(echo "$log" | wc -w)" = 1
            zcat "$log"
            entries=$(zcat "$log" | grep -cE '^[a-z0-9][a-z0-9.+-]* \(.+\) .+; urgency=')
            echo "changelog entries: $entries (want 1)"
            test "$entries" = 1
          elif [ "$LEGACY" != true ] && [ "$PATCH_SERIES" != true ]; then
            # The placeholder stays underneath the build's entry.
            grep -q 'Placeholder changelog' fixture-src/debian/changelog
          fi

  build-deb-arch:
    # Architecture-dependent builds: the Raspbian suites (an ARMv6 root
    # bootstrapped from archive.raspbian.org), Debian armhf, and arch-all:
    # false. On the arm64 runner armhf runs natively, with no QEMU at all.
    # Each is installed and run in a clean container of the image it was
    # built in; --cpu-arch tells an ARMv6 (Raspbian) build from an ARMv7 one.
    name: build-deb-arch (${{ matrix.suite }} ${{ matrix.arch }}${{ matrix.arch-all == 'false' && ' -B' || '' }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: raspbian-bookworm, arch: armhf, runner: ubuntu-24.04-arm, want: "0.3.post1~deb12", cpu: "6", sequoia: none}
          - {suite: raspbian-trixie, arch: armhf, runner: ubuntu-24.04-arm, want: "0.3.post1~deb13", cpu: "6", sequoia: override}
          - {suite: raspbian-forky, arch: armhf, runner: ubuntu-24.04-arm, want: "0.3.post1~deb14", cpu: "6", sequoia: override, build-depends: texinfo}
          - {suite: trixie, arch: armhf, runner: ubuntu-24.04-arm, want: "0.3.post1~deb13", cpu: "7", sequoia: none}
          - {suite: sid, arch: amd64, runner: ubuntu-24.04, arch-all: "false", want: "0.3.post1", cpu: none, sequoia: none}
    steps:
      - uses: actions/checkout@v5

      - name: Make the fixture
        env:
          BUILD_DEPENDS: ${{ matrix.build-depends }}
        run: python3 tests/make-source-fixture.py fixture-src --no-changelog --any ${BUILD_DEPENDS:+--build-depends "$BUILD_DEPENDS"}

      - name: Build with this checkout of build-deb
        id: build
        uses: ./build-deb
        with:
          suite: ${{ matrix.suite }}
          arch: ${{ matrix.arch }}
          arch-all: ${{ matrix.arch-all || 'true' }}
          source-dir: fixture-src

      - name: Build dependencies from Raspbian staging, if any
        env:
          FROM_STAGING: ${{ steps.build.outputs.from-staging }}
        run: |
          echo "from staging: ${FROM_STAGING:-none, the suite sufficed}"

      - name: Check the packages and their versions
        env:
          WANT: ${{ matrix.want }}
          PR: ${{ github.event.pull_request.number }}
          ARCH: ${{ matrix.arch }}
          ARCH_ALL: ${{ matrix.arch-all || 'true' }}
        run: |
          set -eu
          if [ -n "$PR" ]; then WANT="$WANT~pr$PR"; fi
          ls built-debs/
          want="apt-repo-selftest-hello_${WANT}_$ARCH.deb apt-repo-selftest-hello-dbgsym_${WANT}_$ARCH.deb"
          if [ "$ARCH_ALL" = true ]; then want="$want apt-repo-selftest-src_${WANT}_all.deb"; fi
          got=$(find built-debs -name '*.deb' -printf '%f\n' | sort | tr '\n' ' ' | sed 's/ $//')
          want=$(echo "$want" | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//')
          echo "built: $got"
          echo "want:  $want"
          test "$got" = "$want"

      - name: No QEMU on the arm64 runner
        if: runner.arch == 'ARM64'
        run: |
          ls /proc/sys/fs/binfmt_misc/
          if compgen -G '/proc/sys/fs/binfmt_misc/qemu-arm*'; then
            echo "::error::armhf was emulated, although this runner runs it natively"
            exit 1
          fi

      # build-deb/raspbian/README.md, "What the override covers": the Sequoia
      # policy override is in the Raspbian trixie and forky roots, differs
      # from apt's default in the SHA-1 second-preimage date only, and is in
      # nothing built and in no Debian image.
      - name: The Sequoia policy override is only where it should be
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          PLATFORM: ${{ steps.build.outputs.platform }}
          SEQUOIA: ${{ matrix.sequoia }}
        run: |
          set -eu
          for f in built-debs/*.deb; do
            # Listed first, so a dpkg-deb failure fails the step (set -e)
            # instead of reading as "no policy in it".
            contents=$(dpkg-deb -c "$f")
            if printf '%s\n' "$contents" | grep -E 'etc/crypto-policies|apt-sequoia'; then
              echo "::error::$f carries a crypto policy"
              exit 1
            fi
          done
          docker run --rm --platform "$PLATFORM" -e SEQUOIA "$IMAGE" sh -ec '
            o=/etc/crypto-policies/back-ends/apt-sequoia.config
            d=/usr/share/apt/default-sequoia.config
            ls /etc/crypto-policies/back-ends/ || true
            if [ "$SEQUOIA" = none ]; then
              test ! -e "$o"
              echo "no override, as expected"
              exit 0
            fi
            # Every line but the sha1 one is the same.
            rest_d=$(grep -v "^sha1.second_preimage_resistance" "$d")
            rest_o=$(grep -v "^sha1.second_preimage_resistance" "$o")
            test "$rest_d" = "$rest_o"
            grep "^sha1.second_preimage_resistance" "$d" "$o"
            grep -q "^sha1.second_preimage_resistance = 2030-02-01 " "$o"
            echo "override: the SHA-1 second-preimage date only"'

      - name: Install test, in a clean container of the build's image
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          PLATFORM: ${{ steps.build.outputs.platform }}
          APT_SOURCES: ${{ steps.build.outputs.apt-sources }}
          WANT: ${{ matrix.want }}
          PR: ${{ github.event.pull_request.number }}
          CPU: ${{ matrix.cpu }}
        run: |
          set -eu
          if [ -n "$PR" ]; then WANT="$WANT~pr$PR"; fi
          echo "image $IMAGE, platform $PLATFORM"
          docker run --rm --platform "$PLATFORM" -e WANT -e CPU \
            -v "$APT_SOURCES:/apt-sources:ro" -v "$PWD/built-debs:/debs:ro" "$IMAGE" sh -ec '
              sh /apt-sources/install.sh
              apt-get update
              apt-get install -y /debs/*.deb
              got=$(apt-repo-selftest-hello --version)
              echo "$got"
              test "$got" = "apt-repo-selftest-hello $WANT"
              cpu=$(apt-repo-selftest-hello --cpu-arch)
              echo "__ARM_ARCH: $cpu (want $CPU)"
              test "$cpu" = "$CPU"'

  build-deb-refuses-suite:
    # Refused before anything is built: Raspbian is armhf only and has no sid.
    name: build-deb-refuses-suite (${{ matrix.suite }} ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: raspbian-trixie, arch: all}
          - {suite: raspbian-trixie, arch: arm64}
          - {suite: raspbian-sid, arch: armhf}
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/make-source-fixture.py fixture-src --no-changelog --any
      - name: Build it
        id: build
        continue-on-error: true
        uses: ./build-deb
        with:
          suite: ${{ matrix.suite }}
          arch: ${{ matrix.arch }}
          source-dir: fixture-src
      - name: Check it was refused
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::${{ matrix.suite }} ${{ matrix.arch }} was accepted (outcome: $OUTCOME)"
            exit 1
          fi
          if ls built-debs/*.deb; then
            echo "::error::a package was built"
            exit 1
          fi

  mirror-patches:
    # A mirror with our own patches (docs/packaging.md, "Our own patches on
    # a mirror"): a patch branch on the mirrored branch, pinned; the build
    # generates debian/patches from it, and build-deb's dpkg-buildpackage -b
    # applies them. The package must carry the patched file.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: A mirrored branch, a patch branch on it, and a pin
        run: |
          set -eu
          git init -q -b master src
          cd src
          git config user.name selftest; git config user.email selftest@invalid
          printf 'upstream\n' > hello.txt
          git add hello.txt; git commit -qm upstream; git tag 1.0
          git checkout -qb patches/greeting
          printf 'patched by us\n' >> hello.txt; git commit -qam "hello.txt: our greeting"
          git checkout -q master
          printf 'upstream moved\n' > NEWS; git add NEWS; git commit -qm "upstream moves on"
          mkdir -p debian/source
          echo '3.0 (quilt)' > debian/source/format
          printf 'Source: apt-repo-selftest-mirror\nMaintainer: Self Test <selftest@invalid>\nBuild-Depends: debhelper-compat (= 13)\n\nPackage: apt-repo-selftest-mirror\nArchitecture: all\nDescription: selftest\n selftest\n' > debian/control
          printf '#!/usr/bin/make -f\n%%:\n\tdh $@\noverride_dh_auto_install:\n\tinstall -D -m644 hello.txt debian/apt-repo-selftest-mirror/usr/share/selftest/hello.txt\n' > debian/rules
          chmod +x debian/rules
          mkdir -p ../pkg/.github
          printf 'kind = "mirror"\nupstream = "https://example.org/x.git"\n[mirror]\nbuild = "master"\n[[mirror.patches]]\nbranch = "patches/greeting"\ncommit = "%s"\n' \
            "$(git rev-parse patches/greeting)" > ../pkg/.github/apt-packaging.toml
      - name: Check the patches apply, as the sync does
        run: python3 scripts/mirror-patches.py --declaration pkg/.github/apt-packaging.toml --source src --check
      - name: Generate debian/patches
        run: python3 scripts/mirror-patches.py --declaration pkg/.github/apt-packaging.toml --source src
      - name: A tree the generated patch no longer fits
        # As if the tree changed after generating: dpkg-source alone would
        # skip the series, exit 0, and build unpatched.
        run: |
          cp -a src src-broken
          printf 'changed upstream\n' > src-broken/hello.txt
      - name: Build it, which must fail
        id: broken
        continue-on-error: true
        uses: ./build-deb
        with:
          suite: trixie
          arch: all
          source-dir: src-broken
          out-dir: built-broken
          version-args: --owner-tag selftest --upstream-dir . --upstream-tag-match [0-9]*
          lintian: "off"
      - name: Check it failed, and built nothing
        env:
          OUTCOME: ${{ steps.broken.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::a tree whose generated patches don't apply was built (outcome: $OUTCOME)"
            exit 1
          fi
          if ls built-broken/*.deb; then
            echo "::error::a package was built without our patches"
            exit 1
          fi
      - name: Build
        uses: ./build-deb
        with:
          suite: trixie
          arch: all
          source-dir: src
          version-args: --owner-tag selftest --upstream-dir . --upstream-tag-match [0-9]*
          lintian: "off"
      - name: The package carries the patched file
        run: |
          set -eu
          ls built-debs
          dpkg-deb --fsys-tarfile built-debs/apt-repo-selftest-mirror_*_all.deb \
            | tar -xO ./usr/share/selftest/hello.txt | tee hello.txt
          grep -qx 'patched by us' hello.txt

  build-deb-raspbian-staging:
    # build-deb/raspbian/build-dep.sh: a Raspbian build whose build
    # dependencies the suite alone can't satisfy takes them from
    # <codename>-staging, and the install test, in the image without staging,
    # still refuses a package that needs anything only staging has. Cases:
    #   fallback: the fallback forced (APT_REPO_ACTION_SELFTEST_RASPBIAN_STAGING),
    #     so it is proven whatever state the archive is in, with texinfo, whose
    #     perl dependencies forky alone can't install today; the package must
    #     still install from forky alone.
    #   staging-runtime: a package that Depends on a version only staging has
    #     (the newest perl-base there, when it is newer than the suite's) must
    #     fail the install test. With the two in step there is no such version,
    #     and the case says so and passes.
    name: build-deb-raspbian-staging (${{ matrix.case }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        case: [fallback, staging-runtime]
    steps:
      - uses: actions/checkout@v5

      - name: What raspbian forky and forky-staging each have
        id: archive
        run: |
          set -eu
          ver() {
            curl -fsS --retry 5 "http://archive.raspbian.org/raspbian/dists/$1/main/binary-armhf/Packages.xz" \
              | xz -dc | awk -v p="$2" '$1 == "Package:" {n = $2} $1 == "Version:" && n == p {print $2}' | sort -V | tail -n 1
          }
          suite=$(ver forky perl-base)
          staging=$(ver forky-staging perl-base)
          echo "perl-base: forky $suite, forky-staging $staging"
          newer=false
          if dpkg --compare-versions "$staging" gt "$suite"; then newer=true; fi
          echo "staging-newer=$newer" >> "$GITHUB_OUTPUT"
          echo "staging-perl=$staging" >> "$GITHUB_OUTPUT"

      - name: Make the fixture
        env:
          CASE: ${{ matrix.case }}
          STAGING_PERL: ${{ steps.archive.outputs.staging-perl }}
        run: |
          set -eu
          case "$CASE" in
            fallback) python3 tests/make-source-fixture.py fixture-src --no-changelog --any --build-depends texinfo ;;
            staging-runtime) python3 tests/make-source-fixture.py fixture-src --no-changelog --any \
                               --runtime-depends "perl-base (>= $STAGING_PERL)" ;;
          esac
          grep -E '^(Build-)?Depends' fixture-src/debian/control

      - name: Build with this checkout of build-deb
        id: build
        uses: ./build-deb
        env:
          APT_REPO_ACTION_SELFTEST_RASPBIAN_STAGING: ${{ matrix.case == 'fallback' && 'always' || '' }}
        with:
          suite: raspbian-forky
          arch: armhf
          source-dir: fixture-src

      - name: The fallback took texinfo's dependencies from staging
        if: matrix.case == 'fallback'
        env:
          FROM_STAGING: ${{ steps.build.outputs.from-staging }}
          STAGING_NEWER: ${{ steps.archive.outputs.staging-newer }}
        run: |
          set -eu
          echo "from staging: $FROM_STAGING"
          if [ "$STAGING_NEWER" = true ]; then
            # staging's perl is newer, and texinfo pulls perl in.
            case " $FROM_STAGING " in
              *" perl-base "*) ;;
              *) echo "::error::texinfo's perl should have come from forky-staging"; exit 1 ;;
            esac
          fi

      - name: Install test, in the image without staging
        id: install
        continue-on-error: true
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          PLATFORM: ${{ steps.build.outputs.platform }}
        run: |
          set -eu
          docker run --rm --platform "$PLATFORM" -v "$PWD/built-debs:/debs:ro" "$IMAGE" sh -ec '
            if ls /etc/apt/sources.list.d/*staging*; then echo "the image has staging"; exit 1; fi
            apt-get update
            apt-get install -y /debs/*.deb
            apt-repo-selftest-hello --version'

      - name: Check the install test's outcome
        env:
          CASE: ${{ matrix.case }}
          OUTCOME: ${{ steps.install.outcome }}
          STAGING_NEWER: ${{ steps.archive.outputs.staging-newer }}
        run: |
          set -eu
          echo "case $CASE, install test $OUTCOME, staging newer: $STAGING_NEWER"
          case "$CASE" in
            fallback) test "$OUTCOME" = success ;;
            staging-runtime)
              if [ "$STAGING_NEWER" = true ]; then
                test "$OUTCOME" = failure
              else
                echo "::notice::forky and forky-staging have the same perl-base, so no run-time dependency needs staging today; nothing to refuse"
                test "$OUTCOME" = success
              fi ;;
          esac

  build-deb-refuses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/make-source-fixture.py fixture-src
      - name: A version-script that doesn't exist
        id: missing
        continue-on-error: true
        uses: ./build-deb
        with:
          suite: trixie
          arch: all
          source-dir: fixture-src
          version-script: packaging/no-such-script.py
      - name: Check the build failed instead of using the placeholder version
        env:
          OUTCOME: ${{ steps.missing.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::a missing version-script was accepted (outcome: $OUTCOME)"
            exit 1
          fi
          if ls built-debs/*.deb; then
            echo "::error::a package was built without its version"
            exit 1
          fi

  build-deb-lintian:
    # `lintian: error` fails a build with a lintian error (the fixture has
    # no debian/copyright), and `lintian: off` doesn't run it at all. The
    # default, `warn`, is what every build-deb job above runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Make two fixture source trees, one per build
        run: |
          python3 tests/make-source-fixture.py fixture-src
          python3 tests/make-source-fixture.py fixture-off
      - name: lintian errors fail the build with lintian error
        id: error
        continue-on-error: true
        uses: ./build-deb
        with:
          suite: trixie
          arch: all
          source-dir: fixture-src
          lintian: error
      - name: lintian off
        id: off
        uses: ./build-deb
        with:
          suite: trixie
          arch: all
          source-dir: fixture-off
          out-dir: built-debs-off
          lintian: "off"
      - name: Check the outcomes
        env:
          OUTCOME: ${{ steps.error.outcome }}
          ERRORS: ${{ steps.error.outputs.lintian-errors }}
          OFF_ERRORS: ${{ steps.off.outputs.lintian-errors }}
        run: |
          set -eu
          echo "lintian: error: $OUTCOME with $ERRORS errors; off: '$OFF_ERRORS'"
          test "$OUTCOME" = failure
          test "$ERRORS" -ge 1
          test -z "$OFF_ERRORS"
          ls built-debs-off/*.deb

  build-deb-lintian-cannot-run:
    # lintian failing to run at all (here: its package can't be installed)
    # fails the build in warn mode as well as error mode: warn only forgives
    # lintian's findings.
    name: build-deb-lintian-cannot-run (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: warn, want: failure}
          - {mode: error, want: failure}
    env:
      APT_REPO_ACTION_SELFTEST_LINTIAN_PACKAGE: no-such-package-apt-repo-selftest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/make-source-fixture.py fixture-src
      - name: Build, with lintian uninstallable
        id: build
        continue-on-error: true
        uses: ./build-deb
        with:
          suite: trixie
          arch: all
          source-dir: fixture-src
          lintian: ${{ matrix.mode }}
      - name: Check the outcome
        env:
          OUTCOME: ${{ steps.build.outcome }}
          WANT: ${{ matrix.want }}
          ERRORS: ${{ steps.build.outputs.lintian-errors }}
        run: |
          set -eu
          echo "outcome: $OUTCOME (want $WANT); lintian errors: '$ERRORS'"
          test "$OUTCOME" = "$WANT"
          # lintian never ran, so there are no counts.
          test -z "$ERRORS"
          ls built-debs/*.deb

  deb-version-action:
    # The version for a build outside build-deb (docs/packaging.md, "The
    # shared actions"): an nfpm package, as the Go repositories build, and a
    # patch series' own job. nfpm must keep the version exactly as given.
    name: deb-version (${{ matrix.case }} ${{ matrix.suite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: nfpm, suite: trixie, args: "", want: "0.3.post1~deb13"}
          - {case: nfpm, suite: sid, args: "", want: "0.3.post1"}
          - {case: patch-series, suite: forky,
             args: "--owner-tag fpgasonline --upstream-version 20260914",
             want: "20260914+fpgasonline.0.3.post1~deb14"}
    env:
      NFPM_VERSION: 2.47.0
      NFPM_SHA256: 3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/make-source-fixture.py fixture-src
      - name: The version, with this checkout of deb-version
        id: version
        uses: ./deb-version
        with:
          suite: ${{ matrix.suite }}
          source-dir: fixture-src
          version-args: ${{ matrix.args }}
      - name: Check it
        env:
          GOT: ${{ steps.version.outputs.version }}
          WANT: ${{ matrix.want }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          if [ -n "$PR" ]; then WANT="$WANT~pr$PR"; fi
          echo "version: $GOT (want $WANT)"
          test "$GOT" = "$WANT"
      - name: Package it with nfpm, as a Go repository does
        if: matrix.case == 'nfpm'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          curl -fsSL -o nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          echo "$NFPM_SHA256  nfpm.deb" | sha256sum -c
          sudo dpkg -i nfpm.deb
          mkdir -p dist
          printf '#!/bin/sh\necho selftest\n' > dist/apt-repo-selftest-nfpm
          cat > nfpm.yaml <<'NFPM'
          name: apt-repo-selftest-nfpm
          arch: amd64
          platform: linux
          version: ${VERSION}
          version_schema: none
          maintainer: apt-repo-action self-test <selftest@invalid>
          description: apt-repo-action deb-version self-test fixture
          contents:
            - src: ./dist/apt-repo-selftest-nfpm
              dst: /usr/bin/apt-repo-selftest-nfpm
              file_info:
                mode: 0755
          NFPM
          nfpm package -p deb -f nfpm.yaml -t dist/
          ls dist/
          got=$(dpkg-deb -f dist/*.deb Version)
          echo "package version: $got (want $VERSION)"
          test "$got" = "$VERSION"

  build-deb-depends:
    # A build dependency only a declared [[depends]] repository has
    # (docs/packaging.md, "The declaration"). The repository is a throwaway,
    # signed with this checkout of the action and served from the runner on
    # the docker bridge, so the build container reaches it and nothing
    # depends on a live site. The failing cases declare the repository
    # without build-depending on it: only build-deb's own check can fail them.
    name: build-deb-depends (${{ matrix.case }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: bookworm, suite: bookworm, key: apt-repo-action.gpg, want: success}
          - {case: trixie, suite: trixie, key: apt-repo-action.gpg, want: success}
          - {case: armoured key, suite: trixie, key: apt-repo-action.asc, want: success}
          - {case: wrong key, suite: trixie, key: stranger.gpg, want: failure}
          - {case: wrong key bookworm, suite: bookworm, key: stranger.gpg, want: failure}
          - {case: no key, suite: trixie, key: missing.gpg, want: failure}
          - {case: no Release, suite: forky, key: apt-repo-action.gpg, want: failure}
    steps:
      - uses: actions/checkout@v5

      - name: Make the dependency repository's package, its key and a stranger's
        id: fixture
        run: |
          set -eu
          tests/make-fixture.sh dep-repo "bookworm trixie" "$RUNNER_TEMP/private.asc" apt-repo-selftest-dep
          {
            echo "private-key<<END_OF_KEY"
            cat "$RUNNER_TEMP/private.asc"
            echo "END_OF_KEY"
          } >> "$GITHUB_OUTPUT"
          # Another key: the wrong one to trust the repository with.
          tests/make-fixture.sh stranger trixie "$RUNNER_TEMP/stranger.asc"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          gpg --batch --import "$RUNNER_TEMP/stranger.asc"
          mkdir -p dep-repo
          gpg --batch --export > dep-repo/stranger.gpg
          gpgconf --kill gpg-agent

      - name: Index and sign it with this checkout of the action
        uses: ./
        with:
          apt-root: dep-repo
          suites: bookworm trixie
          gpg-private-key: ${{ steps.fixture.outputs.private-key }}

      - name: Serve it on the docker bridge
        id: serve
        run: |
          set -eu
          host=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          nohup python3 -m http.server -d dep-repo -b "$host" 8766 > http-server.log 2>&1 &
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null "http://$host:8766/trixie/InRelease"; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null "http://$host:8766/trixie/InRelease"
          echo "url=http://$host:8766" >> "$GITHUB_OUTPUT"

      - name: Make the fixture source tree, declaring the repository
        env:
          URL: ${{ steps.serve.outputs.url }}
          KEY: ${{ matrix.key }}
          WANT: ${{ matrix.want }}
        run: |
          set -eu
          only=()
          if [ "$WANT" = failure ]; then only=(--declare-only); fi
          python3 tests/make-source-fixture.py fixture-src --no-changelog \
            --depends "$URL" --depends-key "$URL/$KEY" "${only[@]}"
          cat fixture-src/.github/apt-packaging.toml
          grep Build-Depends fixture-src/debian/control

      - name: Build with this checkout of build-deb
        id: build
        continue-on-error: ${{ matrix.want == 'failure' }}
        uses: ./build-deb
        with:
          suite: ${{ matrix.suite }}
          arch: all
          source-dir: fixture-src

      - name: Check the outcome
        env:
          OUTCOME: ${{ steps.build.outcome }}
          WANT: ${{ matrix.want }}
        run: |
          set -eu
          echo "build: $OUTCOME (want $WANT)"
          if [ "$OUTCOME" != "$WANT" ]; then
            echo "::error::the build's outcome was $OUTCOME, not $WANT"
            exit 1
          fi
          if [ "$WANT" = success ]; then
            ls built-debs/apt-repo-selftest-src_*.deb
          elif ls built-debs/*.deb; then
            echo "::error::a package was built without its dependency repository"
            exit 1
          fi

      - name: Install test, with the build's dependency repositories
        if: matrix.want == 'success'
        env:
          SUITE: ${{ matrix.suite }}
          APT_SOURCES: ${{ steps.build.outputs.apt-sources }}
        run: |
          docker run --rm -v "$APT_SOURCES:/apt-sources:ro" -v "$PWD/built-debs:/debs:ro" \
            "debian:$SUITE" sh -ec '
              sh /apt-sources/install.sh
              apt-get install -y apt-repo-selftest-dep /debs/apt-repo-selftest-src_*.deb
              dpkg-query -W apt-repo-selftest-dep apt-repo-selftest-src
            '

  publish-bundle:
    # A dependency repository declared with `bundle` (docs/packaging.md,
    # "Bundling a dependency repository"): its packages ours need are copied
    # into our suite, verified against its signed index, and served with our
    # key, so a client that adds only our repository installs ours. The
    # dependency repository is a throwaway served from the runner on the
    # docker bridge; it breaks after the build in the failing cases, so only
    # the bundling can fail them, and must.
    name: publish-bundle (${{ matrix.case }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: bundled, want: success}
          - {case: tampered dependency, want: failure}
          - {case: unreachable dependency, want: failure}
    steps:
      - uses: actions/checkout@v5

      - name: Make the dependency repository and our key
        id: fixture
        run: |
          set -eu
          tests/make-fixture.sh dep-repo trixie "$RUNNER_TEMP/dep.asc" apt-repo-selftest-dep
          tests/make-fixture.sh "$RUNNER_TEMP/unused" trixie "$RUNNER_TEMP/ours.asc"
          {
            echo "dep-key<<END_OF_KEY"; cat "$RUNNER_TEMP/dep.asc"; echo "END_OF_KEY"
            echo "our-key<<END_OF_KEY"; cat "$RUNNER_TEMP/ours.asc"; echo "END_OF_KEY"
          } >> "$GITHUB_OUTPUT"

      - name: Index and sign the dependency repository
        uses: ./
        with:
          apt-root: dep-repo
          suites: trixie
          gpg-private-key: ${{ steps.fixture.outputs.dep-key }}

      - name: Serve it on the docker bridge
        id: serve
        run: |
          set -eu
          host=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          nohup python3 -m http.server -d dep-repo -b "$host" 8766 > dep-server.log 2>&1 &
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null "http://$host:8766/trixie/InRelease"; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null "http://$host:8766/trixie/InRelease"
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Make the fixture source tree, bundling the repository
        env:
          HOST: ${{ steps.serve.outputs.host }}
        run: |
          set -eu
          python3 tests/make-source-fixture.py fixture-src --no-changelog --bundle \
            --depends "http://$HOST:8766" --depends-key "http://$HOST:8766/apt-repo-action.gpg"
          cat fixture-src/.github/apt-packaging.toml

      - name: Build with this checkout of build-deb
        uses: ./build-deb
        with:
          suite: trixie
          arch: all
          source-dir: fixture-src

      - name: Break the dependency repository
        if: matrix.want == 'failure'
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -eu
          case "$CASE" in
            "tampered dependency") echo tampered >> dep-repo/trixie/apt-repo-selftest-dep_1.0_all.deb ;;
            "unreachable dependency") pkill -f "http.server -d dep-repo" ;;
          esac

      - name: Bundle, as publish-apt does
        id: bundle
        continue-on-error: ${{ matrix.want == 'failure' }}
        run: |
          set -eu
          mkdir -p apt-repo/trixie
          cp built-debs/*.deb apt-repo/trixie/
          python3 scripts/bundle-depends.py fetch --declaration fixture-src/.github/apt-packaging.toml \
            --suite trixie --debs apt-repo/trixie

      - name: Check the outcome
        env:
          OUTCOME: ${{ steps.bundle.outcome }}
          WANT: ${{ matrix.want }}
        run: |
          set -eu
          echo "bundle: $OUTCOME (want $WANT)"
          test "$OUTCOME" = "$WANT"
          ls apt-repo/trixie
          if [ "$WANT" = failure ] && ls apt-repo/trixie/apt-repo-selftest-dep_*.deb; then
            echo "::error::a package was bundled although its repository couldn't be verified"
            exit 1
          fi

      - name: Index and sign ours, with the bundled package
        if: matrix.want == 'success'
        uses: ./
        with:
          apt-root: apt-repo
          suites: trixie
          gpg-private-key: ${{ steps.fixture.outputs.our-key }}

      - name: The bundled package is marked, and served from ours alone
        if: matrix.want == 'success'
        env:
          HOST: ${{ steps.serve.outputs.host }}
        run: |
          set -eu
          cat apt-repo/trixie/Packages
          # The whole stanza: the field comes after the description.
          mark=$(awk -v RS= '/(^|\n)Package: apt-repo-selftest-dep\n/' apt-repo/trixie/Packages \
            | sed -n 's/^Bundled-From: //p')
          echo "Bundled-From: $mark"
          test "$mark" = "http://$HOST:8766/trixie/"
          # Ours isn't marked.
          test -z "$(awk -v RS= '/(^|\n)Package: apt-repo-selftest-src\n/' apt-repo/trixie/Packages \
            | sed -n 's/^Bundled-From: //p')"
          test ! -e apt-repo/trixie/.bundled-override
          grep -q 'bundled from' apt-repo/index.html
          nohup python3 -m http.server -d apt-repo -b "$HOST" 8767 > our-server.log 2>&1 &
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null "http://$HOST:8767/trixie/InRelease"; then break; fi
            sleep 1
          done
          # Only our repository: the dependency repository is never added.
          docker run --rm -e HOST "debian:trixie" sh -ec '
            apt-get update > /dev/null
            apt-get install -y --no-install-recommends curl ca-certificates > /dev/null
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL "http://$HOST:8767/apt-repo-action.gpg" -o /etc/apt/keyrings/ours.gpg
            echo "deb [signed-by=/etc/apt/keyrings/ours.gpg] http://$HOST:8767/trixie/ ./" \
              > /etc/apt/sources.list.d/ours.list
            apt-get update
            apt-get install -y apt-repo-selftest-src
            dpkg-query -W apt-repo-selftest-src apt-repo-selftest-dep
            apt-cache policy apt-repo-selftest-dep | grep -F "http://$HOST:8767/trixie"
          '
          # Nothing newer upstream: a scheduled refresh starts nothing.
          python3 scripts/bundle-depends.py stale --declaration fixture-src/.github/apt-packaging.toml \
            --suites trixie --site "http://$HOST:8767" | tee stale.txt
          grep -qx "stale: no" stale.txt
          # An install test adds no bundled repository.
          test "$(python3 scripts/apt-sources.py write --unbundled \
            --declaration fixture-src/.github/apt-packaging.toml --suite trixie --dest unbundled)" = 0

  reusable-build:
    # The reusable build-deb.yml, as a repository calls it, on the committed
    # tests/fixtures/hello tree: an Architecture: all package and an
    # architecture-dependent command. Debian trixie on three architectures
    # (amd64 builds the Architecture: all package; arm64 and armhf don't)
    # and raspbian-trixie. dbgsym-limit-mb: 0 sends every -dbgsym to the
    # dbgsym artifacts.
    uses: ./.github/workflows/build-deb.yml
    with:
      source-dir: tests/fixtures/hello
      suites: trixie raspbian-trixie
      architectures: amd64 arm64 armhf
      dbgsym-limit-mb: 0

  reusable-build-check:
    needs: reusable-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the fixture's version is this repository's git describe
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Check the outputs and the artifacts
        env:
          SUITES: ${{ needs.reusable-build.outputs.suites }}
          ARCHITECTURES: ${{ needs.reusable-build.outputs.architectures }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          echo "suites: $SUITES"
          echo "architectures: $ARCHITECTURES"
          test "$SUITES" = "trixie raspbian-trixie"
          test "$ARCHITECTURES" = "amd64 arm64 armhf all"
          ver() {
            (cd tests/fixtures/hello &&
             python3 ../../../scripts/deb-version.py --suite "$1" ${PR:+--pr "$PR"})
          }
          t=$(ver trixie)
          r=$(ver raspbian-trixie)
          echo "want versions: trixie $t, raspbian-trixie $r"
          find artifacts -type f | sort
          want=$(sort <<EOF
          artifacts/dbgsym-raspbian-trixie-armhf/apt-repo-selftest-hello-dbgsym_${r}_armhf.deb
          artifacts/dbgsym-trixie-amd64/apt-repo-selftest-hello-dbgsym_${t}_amd64.deb
          artifacts/dbgsym-trixie-arm64/apt-repo-selftest-hello-dbgsym_${t}_arm64.deb
          artifacts/dbgsym-trixie-armhf/apt-repo-selftest-hello-dbgsym_${t}_armhf.deb
          artifacts/debs-raspbian-trixie-armhf/apt-repo-selftest-hello_${r}_armhf.deb
          artifacts/debs-raspbian-trixie-armhf/apt-repo-selftest-src_${r}_all.deb
          artifacts/debs-trixie-amd64/apt-repo-selftest-hello_${t}_amd64.deb
          artifacts/debs-trixie-amd64/apt-repo-selftest-src_${t}_all.deb
          artifacts/debs-trixie-arm64/apt-repo-selftest-hello_${t}_arm64.deb
          artifacts/debs-trixie-armhf/apt-repo-selftest-hello_${t}_armhf.deb
          EOF
          )
          # Only this workflow's: the run's other jobs upload artifacts too,
          # and collect-debs' test artifacts are debs-*-selftest-<case>.
          got=$(find artifacts/debs-* artifacts/dbgsym-* -type f | grep -v -- '-selftest-[^/]*/' | sort)
          if [ "$got" != "$want" ]; then
            diff <(echo "$want") <(echo "$got") || true
            echo "::error::the artifacts are not the ones expected"
            exit 1
          fi

  apt-sources-pages:
    # The `repo = "owner/name"` form against the real GitHub API, with the
    # workflow's own read-only token: all build-deb has. Only the URLs are
    # checked, not what the site serves.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Resolve a public repository's Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '[[depends]]\nrepo = "github/choosealicense.com"\nreason = "self-test"\n' > decl.toml
          python3 scripts/apt-sources.py resolve --declaration decl.toml --suite trixie > resolved.json
          cat resolved.json
          python3 - <<'EOF'
          import json
          [r] = json.load(open("resolved.json"))
          assert r["uri"].startswith("http") and r["uri"].endswith("/trixie/"), r["uri"]
          assert r["dist"] == "./" and r["components"] == [], r
          assert r["key"] == r["uri"].removesuffix("trixie/") + "choosealicense.com.gpg", r["key"]
          assert r["keyring"] == "/etc/apt/keyrings/choosealicense.com.gpg", r["keyring"]
          EOF

  collect-debs-upload:
    # Artifacts for collect-debs below: one that its pattern is the only
    # match for, and three for the other, suites with and without a dash.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - {name: debs-trixie-amd64-selftest-one, deb: one_1_amd64.deb}
          - {name: debs-bookworm-selftest-many, deb: many-a_1_all.deb}
          - {name: debs-trixie-amd64-selftest-many, deb: many-b_1_amd64.deb}
          - {name: debs-raspbian-trixie-armhf-selftest-many, deb: many-c_1_armhf.deb}
    steps:
      - name: A placeholder .deb
        env:
          DEB: ${{ matrix.deb }}
        run: mkdir out && echo placeholder > "out/$DEB"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/

  collect-debs:
    # publish-apt.yml's first half, with the workflow's read-only token, as
    # every caller's publish job has it. download-artifact v5+ extracts a
    # lone matching artifact with no <name>/ directory, so "one" is the case
    # that broke the regroup.
    needs: collect-debs-upload
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: one
            want: "trixie/one_1_amd64.deb"
          - case: many
            want: "bookworm/many-a_1_all.deb trixie/many-b_1_amd64.deb raspbian-trixie/many-c_1_armhf.deb"
    name: collect-debs (${{ matrix.case }})
    steps:
      - uses: actions/checkout@v5
      - name: Collect
        id: collect
        uses: ./collect-debs
        with:
          suites: bookworm trixie raspbian-trixie
          pattern: debs-*-selftest-${{ matrix.case }}
          dest: apt-repo
      - name: Each .deb is in its suite, and nothing else is
        env:
          WANT: ${{ matrix.want }}
          COUNT: ${{ steps.collect.outputs.count }}
        run: |
          set -eu
          (cd apt-repo && find . -type f | sed 's|^\./||' | sort) > got
          # shellcheck disable=SC2086 # one path per word
          printf '%s\n' $WANT | sort > want
          diff -u want got
          test "$COUNT" = "$(wc -l < want)"
          for s in bookworm trixie raspbian-trixie; do test -d "apt-repo/$s"; done

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build a fixture package and a throwaway signing key
        id: fixture
        run: |
          set -eu
          tests/make-fixture.sh apt-repo "bookworm trixie" "$RUNNER_TEMP/private.asc"
          {
            echo "private-key<<END_OF_KEY"
            cat "$RUNNER_TEMP/private.asc"
            echo "END_OF_KEY"
          } >> "$GITHUB_OUTPUT"
          cp -r apt-repo apt-repo-badname

      - name: Index and sign with this checkout of the action
        uses: ./
        with:
          apt-root: apt-repo
          suites: bookworm trixie
          # No keyring-name or origin: both default to the repository name.
          gpg-private-key: ${{ steps.fixture.outputs.private-key }}

      - name: Names follow the repository name (docs/conventions.md)
        run: |
          set -eu
          test -f apt-repo/apt-repo-action.gpg
          test -f apt-repo/apt-repo-action.asc
          grep -q 'href="apt-repo-action.gpg"' apt-repo/index.html
          grep -q 'href="apt-repo-action.asc"' apt-repo/index.html
          grep -q 'signed-by=/etc/apt/keyrings/apt-repo-action.gpg' apt-repo/index.html
          grep -q '^Origin: apt-repo-action$' apt-repo/trixie/Release
          grep -q '^Label: apt-repo-action$' apt-repo/trixie/Release
          fpr=$(gpg --show-keys --with-colons apt-repo/apt-repo-action.gpg | awk -F: '/^fpr/ {print $10; exit}')
          grep -q "$fpr" apt-repo/index.html

      # Suites holding different architectures, published with a caller's
      # usual list: each Release advertises only what its suite holds
      # (docs/packaging.md, "Architectures").
      - name: Build suites with different architectures
        run: |
          set -eu
          deb() {  # deb <suite> <arch>
            d=$(mktemp -d)
            mkdir -p "$d/DEBIAN"
            printf 'Package: apt-repo-selftest-%s\nVersion: 1.0\nArchitecture: %s\nMaintainer: apt-repo-action self-test <selftest@invalid>\nDescription: apt-repo-action self-test fixture\n' \
              "$2" "$2" > "$d/DEBIAN/control"
            mkdir -p "apt-repo-arches/$1"
            dpkg-deb --build --root-owner-group "$d" "apt-repo-arches/$1/apt-repo-selftest-$2_1.0_$2.deb"
          }
          deb bookworm all
          deb bookworm amd64
          deb bookworm arm64
          deb raspbian-trixie armhf

      - name: Index and sign suites with different architectures
        uses: ./
        with:
          apt-root: apt-repo-arches
          suites: bookworm raspbian-trixie
          architectures: amd64 arm64 armhf riscv64 all
          gpg-private-key: ${{ steps.fixture.outputs.private-key }}

      - name: Each Release advertises only its suite's architectures
        run: |
          set -eu
          for want in "bookworm:all amd64 arm64" "raspbian-trixie:armhf"; do
            suite=${want%%:*}
            got=$(sed -n 's/^Architectures: //p' "apt-repo-arches/$suite/Release")
            echo "$suite: Architectures: $got"
            if [ "$got" != "${want#*:}" ]; then
              echo "::error::$suite's Release advertises '$got', not '${want#*:}'"
              exit 1
            fi
            grep -q "^Architectures: $got\$" "apt-repo-arches/$suite/InRelease"
          done
          # The all-only suites above still say all.
          grep -q '^Architectures: all$' apt-repo/trixie/Release

      - name: carry-over.py copies a live repository byte for byte
        run: |
          set -eu
          python3 -m http.server -d apt-repo 8765 &
          server=$!
          trap 'kill $server' EXIT
          sleep 2
          mkdir carried
          python3 scripts/carry-over.py --site http://127.0.0.1:8765 --dest carried \
            bookworm apt-repo-action.gpg
          diff -r apt-repo/bookworm carried/bookworm
          cmp apt-repo/apt-repo-action.gpg carried/apt-repo-action.gpg
          # old=new serves a live file under a previous layout's path.
          python3 scripts/carry-over.py --site http://127.0.0.1:8765 --dest carried \
            old/place/key.gpg=apt-repo-action.gpg
          cmp apt-repo/apt-repo-action.gpg carried/old/place/key.gpg
          # A path the new layout already publishes differently is refused.
          echo different > carried/apt-repo-action.asc
          if python3 scripts/carry-over.py --site http://127.0.0.1:8765 --dest carried \
               apt-repo-action.asc; then
            echo "::error::carry-over overwrote a file of the new layout"
            exit 1
          fi

      - name: keep-history.py keeps earlier versions within the size limit
        run: tests/keep-history-check.sh apt-repo

      - name: A keyring-name apt cannot type is refused
        id: badname
        continue-on-error: true
        uses: ./
        with:
          apt-root: apt-repo-badname
          suites: bookworm trixie
          keyring-name: selftest.key
          gpg-private-key: ${{ steps.fixture.outputs.private-key }}

      - name: Check the untyped keyring-name failed the publish
        env:
          OUTCOME: ${{ steps.badname.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::keyring-name selftest.key was accepted (outcome: $OUTCOME)"
            exit 1
          fi

      - name: No private key material published or left on the runner
        run: |
          set -u
          fail=0
          # Published tree: no armoured private block, and the keyrings hold
          # public packets only.
          if grep -rl 'PRIVATE KEY' apt-repo/; then
            echo "::error::a published file contains a private key block"
            fail=1
          fi
          for k in apt-repo/apt-repo-action.gpg apt-repo/apt-repo-action.asc; do
            if gpg --homedir "$(mktemp -d)" --list-packets "$k" | grep -q '^:secret'; then
              echo "::error::$k contains a secret key packet"
              fail=1
            fi
          done
          # The sign step must remove its gpg home on every exit path, the
          # refused keyring-name above included.
          left=$(find /tmp "$RUNNER_TEMP" -path '*/private-keys-v1.d/*' -type f || true)
          if [ -n "$left" ]; then
            echo "::error::imported private key left on the runner:"
            echo "$left"
            fail=1
          fi
          exit "$fail"

      - uses: actions/upload-artifact@v7
        with:
          name: selftest-apt-repo
          path: apt-repo/

  apt-client:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "debian:bookworm", suite: bookworm}  # apt 2.6, gpgv
          - {image: "debian:trixie", suite: trixie}      # apt 3.0, sqv
          - {image: "ubuntu:jammy", suite: bookworm}     # apt 2.4, gpgv
          - {image: "ubuntu:noble", suite: bookworm}     # apt 2.8, gpgv
    name: apt-client (${{ matrix.image }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: selftest-apt-repo
          path: apt-repo/

      - name: Install from the published repository with each keyring
        env:
          IMAGE: ${{ matrix.image }}
          SUITE: ${{ matrix.suite }}
        run: |
          docker run --rm \
            -v "$PWD/apt-repo:/repo:ro" -v "$PWD/tests:/tests:ro" \
            "$IMAGE" bash /tests/apt-client-check.sh /repo "$SUITE" apt-repo-action
