name: Sync a mirror

# Reusable workflow for a mirror repository (docs/packaging.md, "Mirrors"):
# copies every branch and tag of the declared `upstream` here, exactly
# (scripts/sync-mirror.py), and when `[mirror] build` moved, starts the
# repository's deb.yml on its default branch, which builds and publishes it.
# A push made with the workflow's own token starts no workflow by itself, so
# this has to. With [[mirror.patches]], it first checks our patches still
# apply to the new upstream tip; if one doesn't, it starts no build and
# opens (or comments on) an issue instead.
#
# A mirror repository's .github/workflows/sync-upstream.yml is then:
#
#   name: Sync upstream
#   on:
#     schedule:
#       - cron: "0 6 * * *"   # daily
#     workflow_dispatch:
#   permissions:
#     contents: write         # push the copies
#     actions: write          # start deb.yml
#     issues: write           # with [[mirror.patches]]: say when one doesn't apply
#   concurrency:
#     group: sync-upstream
#     cancel-in-progress: false
#   jobs:
#     sync:
#       uses: mithro/apt-repo-action/.github/workflows/sync-mirror.yml@main
#       # secrets:
#       #   token: ${{ secrets.MIRROR_TOKEN }}   # see `token` below
#
# The workflow runs with the permissions the caller grants (it asks for
# none of its own, so a caller's issues: write reaches it); a caller that
# grants less fails where it needs them.

on:
  workflow_call:
    inputs:
      declaration:
        description: The declaration, relative to the repository's root.
        type: string
        required: false
        default: .github/apt-packaging.toml
    secrets:
      token:
        description: >-
          Optional. A token that pushes the copies instead of the workflow's
          own, which GitHub won't let create or change .github/workflows/
          files: an upstream that has any (most on GitHub) needs a GitHub App
          token or a fine-grained token with Contents and Workflows write. A
          repository secret, set by the repository's owner.
        required: false
    outputs:
      build:
        description: '"true" when the built branch moved (and our patches apply), and deb.yml was started.'
        value: ${{ jobs.sync.outputs.build }}

jobs:
  sync:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.mirror.outputs.build }}
    steps:
      # A scheduled run's event has no repository, so
      # github.event.repository.default_branch is empty there: ask the API.
      - name: The default branch
        id: default
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          if [ -z "$branch" ]; then
            echo "::error::couldn't read $GITHUB_REPOSITORY's default branch"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      # The default branch, whatever ref started the run: the declaration,
      # and what "ours" means, are the default branch's. With its history,
      # to tell our tags from upstream's and check our patches.
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.default.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}
      - name: Check out apt-repo-action, at this workflow's commit
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .apt-repo-action
          persist-credentials: false
      - name: Mirror upstream
        id: mirror
        env:
          DECLARATION: ${{ inputs.declaration }}
          DEFAULT: ${{ steps.default.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .apt-repo-action/scripts/sync-mirror.py --declaration "$DECLARATION" --default "$DEFAULT"
      # Even when the sync step failed later (a tag push that failed other
      # than by a ruleset): it writes `build` as soon as the branches are
      # pushed, so a build it decided on is never lost.
      - name: Build and publish
        if: ${{ !cancelled() && steps.mirror.outputs.build == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT: ${{ steps.default.outputs.branch }}
        run: |
          if ! gh workflow run deb.yml --ref "$DEFAULT" --repo "$GITHUB_REPOSITORY"; then
            # The copies are already pushed, so the next sync sees nothing
            # new: start the build by hand.
            echo "::error::couldn't start deb.yml. The copies are pushed, so the next sync won't start it either: run \"Debian packages\" on $DEFAULT by hand."
            exit 1
          fi
      - name: Say our patches don't apply
        if: ${{ !cancelled() && steps.mirror.outputs.patch-conflict != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT: ${{ steps.mirror.outputs.patch-conflict }}
        run: |
          set -eu
          title="Mirror: our patches don't apply to upstream"
          body="$CONFLICT

          The sync copied upstream, but didn't start the build, so the last good package stays published. Rebase the patch branch onto the built branch (tag its old tip archive/patches/<topic>/<date> first) and move its pin in .github/apt-packaging.toml (docs/packaging.md in mithro/apt-repo-action, \"Our own patches on a mirror\").

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
