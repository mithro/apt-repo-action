name: Build a .deb for one suite and architecture
description: >-
  Run dpkg-buildpackage inside debian:<suite> for one architecture, after
  stamping the version with the shared scripts/deb-version.py. Emits the .debs
  into a directory ready to upload as a debs-<suite>-<arch> artifact.

# Covers the dpkg-buildpackage family only. Repositories that build with nfpm
# (Go projects) keep their own build step and use only the publish half --
# see README.md. The version rules are docs/packaging.md's ("Versions").

inputs:
  suite:
    description: >-
      Suite to build in: a Debian suite (bookworm, trixie, forky, sid), built
      in debian:<suite>, or raspbian-<codename> (raspbian-bookworm,
      raspbian-trixie, raspbian-forky), built in a Raspbian root file system
      bootstrapped from archive.raspbian.org. Raspbian suites are armhf only.
    required: true
  arch:
    description: >-
      Target architecture: amd64, i386, arm64, armhf, riscv64, or "all" for a
      repository whose packages are all Architecture: all (built once, on the
      runner's own architecture).
    required: true
  arch-all:
    description: >-
      For an architecture-dependent build (arch is not "all"): "true" (the
      default) also builds the Architecture: all packages, "false" builds only
      the architecture-dependent ones (dpkg-buildpackage -B). A matrix builds
      the Architecture: all packages in one job per suite, so no two jobs
      publish different files under the same name.
    required: false
    default: "true"
  build-deps:
    description: >-
      Extra apt packages to install before building, space-separated. Build
      dependencies belong in debian/control, which is always installed from;
      this is only for what can't be declared there.
    required: false
    default: ""
  source-dir:
    description: The source tree to build, relative to the workspace.
    required: false
    default: "."
  out-dir:
    description: Directory the built .debs are collected into.
    required: false
    default: built-debs
  version-script:
    description: >-
      How debian/changelog gets this build's version. "auto" (the default):
      the shared scripts/deb-version.py, or, while a repository still carries
      its own packaging/deb-version.py, that one (with a warning). "shared":
      always the shared script. A path: that script, run with
      --write-changelog; the build fails if it is missing. "none" (or empty):
      the committed changelog's version is used as it is.
    required: false
    default: auto
  github-token:
    description: >-
      Token for the GitHub API, which gives the site of each `repo = ...`
      dependency repository declared in the source tree's
      .github/apt-packaging.toml (docs/packaging.md, "The declaration").
    required: false
    default: ${{ github.token }}

outputs:
  apt-sources:
    description: >-
      A directory on the runner holding the dependency repositories this
      build used, as scripts/apt-sources.py writes them. An install test
      mounts it into its container and runs `sh <dir>/install.sh` (as root)
      before installing the built packages; with none declared for the
      suite, install.sh does nothing.
    value: ${{ steps.depends.outputs.path }}
  image:
    description: >-
      The docker image the build ran in: debian:<suite>, or the Raspbian root
      file system imported for this job. An install test runs a clean
      container of it, with the same --platform.
    value: ${{ steps.plan.outputs.image }}
  platform:
    description: The docker --platform the build ran with (linux/arm/v6 for Raspbian).
    value: ${{ steps.plan.outputs.platform }}

runs:
  using: composite
  steps:
    # riscv64 only became an official Debian architecture in trixie; there is no
    # bookworm riscv64 archive to install build-deps from. Fail with a clear
    # message rather than a confusing apt error deep inside the container.
    - name: Check the inputs
      id: plan
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        ARCH: ${{ inputs.arch }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        VERSION_SCRIPT: ${{ inputs.version-script }}
        ARCH_ALL: ${{ inputs.arch-all }}
      run: |
        set -eu
        case "$ARCH_ALL" in
          true|false) ;;
          *) echo "::error::arch-all is \"$ARCH_ALL\": it takes true or false"; exit 1 ;;
        esac
        if [ "$ARCH" = "riscv64" ] && [ "$SUITE" = "bookworm" ]; then
          echo "::error::riscv64 is not an official Debian architecture in bookworm"
          exit 1
        fi
        case "$RUNNER_ARCH" in
          X64)   native="amd64 i386 all"; all_platform=linux/amd64 ;;
          ARM64) native="arm64 all";      all_platform=linux/arm64 ;;
          *) echo "::error::unsupported runner architecture $RUNNER_ARCH"; exit 1 ;;
        esac
        case "$ARCH" in
          amd64)   platform=linux/amd64 ;;
          i386)    platform=linux/386 ;;
          arm64)   platform=linux/arm64 ;;
          armhf)   platform=linux/arm/v7 ;;
          riscv64) platform=linux/riscv64 ;;
          all)     platform=$all_platform ;;
          *) echo "::error::unknown arch $ARCH"; exit 1 ;;
        esac
        image="debian:$SUITE"
        codename=
        case "$SUITE" in
          raspbian-*)
            # Raspbian is Debian rebuilt for ARMv6 armhf; it has no other
            # architecture and no sid (docs/packaging.md, "Suites").
            codename=${SUITE#raspbian-}
            case "$codename" in
              ""|sid|*[!a-z]*) echo "::error::unknown Raspbian suite $SUITE: Raspbian has raspbian-<codename> for bookworm, trixie and forky, and no sid"; exit 1 ;;
            esac
            if [ "$ARCH" != armhf ]; then
              echo "::error::$SUITE is armhf only, not $ARCH. A repository whose packages are all Architecture: all publishes only the Debian suites, which Raspbian hosts use (docs/packaging.md, \"Suites\")."
              exit 1
            fi
            platform=linux/arm/v6
            image="apt-repo-action/raspbian:$codename" ;;
        esac
        # 64-bit ARM CPUs may also run 32-bit ARM code natively (GitHub's
        # Neoverse-N2 arm64 runners do), or may not (AArch32 is optional), so
        # try it instead of assuming either way. Pulling an armhf image
        # points its tag at armhf, and a later docker run without --platform
        # would then run armhf under QEMU without saying so. So the try uses
        # the image an armhf Debian build pulls anyway, and a Raspbian build,
        # which pulls no Debian image, removes the tag again.
        if [ "$ARCH" = armhf ] && [ "$RUNNER_ARCH" = ARM64 ]; then
          try="debian:${codename:-$SUITE}"
          if docker run --rm --platform linux/arm/v7 "$try" true; then
            native="$native armhf"
          fi
          if [ -n "$codename" ]; then docker image rm "$try"; fi
        fi
        emulated=true
        for a in $native; do [ "$a" = "$ARCH" ] && emulated=false; done

        src="$GITHUB_WORKSPACE/$SOURCE_DIR"
        case "$VERSION_SCRIPT" in
          auto)
            if [ -f "$src/packaging/deb-version.py" ]; then
              echo "::warning::using this repository's own packaging/deb-version.py. Delete it to use the shared scripts/deb-version.py, which adds the ~deb<R> and ~pr<P> suffixes (docs/packaging.md, \"Versions\")."
              mode=script; script=packaging/deb-version.py
            else
              mode=shared; script=
            fi ;;
          shared) mode=shared; script= ;;
          none|"") mode=none; script= ;;
          *)
            if [ ! -f "$src/$VERSION_SCRIPT" ]; then
              echo "::error::version-script $VERSION_SCRIPT does not exist. Without it the build would carry the committed changelog's version, which can go backwards."
              exit 1
            fi
            mode=script; script=$VERSION_SCRIPT ;;
        esac
        {
          echo "platform=$platform"
          echo "image=$image"
          echo "raspbian=$codename"
          echo "emulated=$emulated"
          echo "version-mode=$mode"
          echo "version-script=$script"
        } >> "$GITHUB_OUTPUT"

    # Build dependencies Debian doesn't have for this suite come from the
    # repositories declared as [[depends]] (docs/packaging.md, "The
    # declaration"). Resolved and their keys fetched here, on the runner,
    # which has the token; the container only installs what this writes.
    - name: Resolve the dependency repositories
      id: depends
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        GH_TOKEN: ${{ inputs.github-token }}
        ACTION_ROOT: ${{ github.action_path }}/..
      run: |
        set -eu
        dest=$(mktemp -d "$RUNNER_TEMP/apt-sources.XXXXXX")
        n=$(python3 "$ACTION_ROOT/scripts/apt-sources.py" write --suite "$SUITE" \
              --declaration "$GITHUB_WORKSPACE/$SOURCE_DIR/.github/apt-packaging.toml" --dest "$dest")
        # path: always, for an install test. dir: only when there is
        # something to install, so the build is unchanged without it.
        echo "path=$dest" >> "$GITHUB_OUTPUT"
        if [ "$n" = 0 ]; then dest=; fi
        echo "dir=$dest" >> "$GITHUB_OUTPUT"

    - name: Enable binfmt for cross-architecture containers
      if: steps.plan.outputs.emulated == 'true'
      shell: bash
      run: docker run --privileged --rm tonistiigi/binfmt --install all

    # There is no official Raspbian image, so a raspbian-<codename> build
    # bootstraps one from archive.raspbian.org, verified with the key pinned
    # in build-deb/raspbian/ (see its README.md). It is cached in the calling
    # repository for a week: the cache needs no secret or registry, and the
    # build runs apt-get update itself, so a week-old root only means a few
    # more downloads.
    - name: Plan the Raspbian root file system
      id: raspbian
      if: steps.plan.outputs.raspbian != ''
      shell: bash
      env:
        CODENAME: ${{ steps.plan.outputs.raspbian }}
        KEY: ${{ github.action_path }}/raspbian/raspbian.public.key
        # docs: build-deb/raspbian/README.md. Change both together.
        FINGERPRINT: A0DA38D0D76E8B5D638872819165938D90FDDD2E
      run: |
        set -eu
        got=$(gpg --show-keys --with-colons "$KEY" | awk -F: '$1 == "fpr" { print $10; exit }')
        if [ "$got" != "$FINGERPRINT" ]; then
          echo "::error::build-deb/raspbian/raspbian.public.key is $got, not the pinned $FINGERPRINT"
          exit 1
        fi
        keysum=$(sha256sum "$KEY" | cut -c1-16)
        {
          echo "tar=$RUNNER_TEMP/apt-repo-action-raspbian/$CODENAME.tar"
          echo "cache-key=apt-repo-action-raspbian-$CODENAME-$(date -u +%G-W%V)-$keysum-1"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the Raspbian root file system
      id: raspbian-cache
      if: steps.plan.outputs.raspbian != ''
      uses: actions/cache@v6
      with:
        path: ${{ steps.raspbian.outputs.tar }}
        key: ${{ steps.raspbian.outputs.cache-key }}

    - name: Bootstrap the Raspbian root file system
      if: steps.plan.outputs.raspbian != '' && steps.raspbian-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CODENAME: ${{ steps.plan.outputs.raspbian }}
        TAR: ${{ steps.raspbian.outputs.tar }}
        KEY: ${{ github.action_path }}/raspbian/raspbian.public.key
        HOOK: ${{ github.action_path }}/raspbian/customize.sh
      run: |
        set -eux
        sudo apt-get update
        # arch-test: how mmdebstrap finds out armhf runs (natively or not).
        sudo apt-get install -y --no-install-recommends mmdebstrap arch-test
        # signed-by names a path that is the same outside the root (apt's
        # update during the bootstrap) and inside it (every later update).
        keyring=/usr/share/keyrings/apt-repo-action-raspbian.gpg
        gpg --dearmor < "$KEY" > "$RUNNER_TEMP/apt-repo-action-raspbian.gpg"
        sudo install -D -m 644 "$RUNNER_TEMP/apt-repo-action-raspbian.gpg" "$keyring"
        mkdir -p "$(dirname "$TAR")"
        # minbase follows the archive's priorities, and Raspbian bookworm's
        # leave apt out, so it is asked for. archive.raspbian.org drops the
        # odd TLS connection mid-download, so apt retries, here and in
        # every later apt run in the root (--aptopt stays in its apt.conf.d).
        sudo mmdebstrap --variant=minbase --architectures=armhf \
          --include=apt,ca-certificates \
          --aptopt='Acquire::Retries "5"' \
          --setup-hook='mkdir -p "$1/usr/share/keyrings"' \
          --setup-hook="copy-in $keyring /usr/share/keyrings/" \
          --customize-hook="$HOOK" \
          "$CODENAME" "$TAR" \
          "deb [signed-by=$keyring] https://archive.raspbian.org/raspbian $CODENAME main contrib non-free rpi"
        sudo chown "$(id -u):$(id -g)" "$TAR"
        ls -lh "$TAR"

    - name: Load the Raspbian root file system into docker
      if: steps.plan.outputs.raspbian != ''
      shell: bash
      env:
        TAR: ${{ steps.raspbian.outputs.tar }}
        IMAGE: ${{ steps.plan.outputs.image }}
      run: docker import --platform linux/arm/v6 "$TAR" "$IMAGE"

    - name: Build
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        ARCH: ${{ inputs.arch }}
        ARCH_ALL: ${{ inputs.arch-all }}
        IMAGE: ${{ steps.plan.outputs.image }}
        BUILD_DEPS: ${{ inputs.build-deps }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        OUT_DIR: ${{ inputs.out-dir }}
        PLATFORM: ${{ steps.plan.outputs.platform }}
        VERSION_MODE: ${{ steps.plan.outputs.version-mode }}
        VERSION_SCRIPT: ${{ steps.plan.outputs.version-script }}
        PR: ${{ github.event.pull_request.number }}
        ACTION_ROOT: ${{ github.action_path }}/..
        DEPENDS_DIR: ${{ steps.depends.outputs.dir }}
      run: |
        set -eux
        mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"
        depends=()
        if [ -n "$DEPENDS_DIR" ]; then depends=(-v "$DEPENDS_DIR:/work/apt-sources:ro"); fi
        docker run --rm --platform "$PLATFORM" \
          -v "$GITHUB_WORKSPACE/$SOURCE_DIR:/work/src" \
          -v "$GITHUB_WORKSPACE/$OUT_DIR:/work/out" \
          -v "$(cd "$ACTION_ROOT" && pwd):/work/apt-repo-action:ro" \
          "${depends[@]}" \
          -w /work/src \
          -e SUITE -e ARCH -e ARCH_ALL -e BUILD_DEPS -e VERSION_MODE -e VERSION_SCRIPT -e PR \
          -e GITHUB_REPOSITORY \
          "$IMAGE" bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential ca-certificates debhelper dpkg-dev fakeroot git python3 $BUILD_DEPS
            # The declared dependency repositories, if any: fails unless
            # each one is fetched and its signature verified.
            if [ -e /work/apt-sources/install.sh ]; then sh /work/apt-sources/install.sh; fi
            # Build dependencies come from debian/control (docs/packaging.md, "Builds").
            apt-get build-dep -y ./
            # git refuses to read a tree owned by another user.
            git config --global --add safe.directory "*"
            case "$VERSION_MODE" in
              shared) python3 /work/apt-repo-action/scripts/deb-version.py \
                        --suite "$SUITE" ${PR:+--pr "$PR"} --write-changelog ;;
              script) python3 "$VERSION_SCRIPT" --write-changelog ;;
            esac
            dpkg-parsechangelog -S Version
            # -A: only the Architecture: all packages; -B: only the
            # architecture-dependent ones; -b: both.
            # dpkg-buildpackage takes SOURCE_DATE_EPOCH from the changelog date.
            if [ "$ARCH" = all ]; then what=-A
            elif [ "$ARCH_ALL" = false ]; then what=-B
            else what=-b; fi
            dpkg-buildpackage -us -uc "$what"
            # dpkg-buildpackage writes to the parent directory.
            cp /work/*.deb /work/out/
            ls -lh /work/out/
          '
