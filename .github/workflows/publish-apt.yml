name: Publish signed APT repository to Pages

# Reusable workflow. Collects the .deb artifacts a caller's build jobs uploaded,
# indexes and signs one flat repository per suite, and deploys the result to
# GitHub Pages.
#
# Callers upload one artifact per (suite, arch) named `debs-<suite>-<arch>`
# (or just `debs-<suite>`, or with further `-<suffix>`es); this workflow regroups them into
# apt-repo/<suite>/ before indexing, matching each name against the longest
# suite in `suites` -- a suite may itself contain a dash (raspbian-trixie).
#
# Every name is derived from the repository name; see docs/conventions.md.
#
# Usage:
#   jobs:
#     publish:
#       needs: build
#       uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
#       with:
#         suites: "bookworm trixie sid"
#       secrets:
#         gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}

on:
  workflow_call:
    inputs:
      suites:
        description: Space-separated suites (e.g. "bookworm trixie sid").
        required: true
        type: string
      architectures:
        description: >-
          Deprecated: each suite's Release advertises exactly the
          architectures its packages have, read from its own Packages index.
          A value other than "all" only adds a warning when a suite holds an
          architecture it doesn't list.
        required: false
        default: all
        type: string
      origin:
        description: Deprecated; Origin/Label are the repository name.
        required: false
        default: ""
        type: string
      description:
        description: Human-readable description for Release.
        required: false
        default: ""
        type: string
      keyring-name:
        description: >-
          Deprecated; the key is published as <repo>.gpg (binary) and
          <repo>.asc (armoured).
        required: false
        default: ""
        type: string
      legacy-paths:
        description: >-
          Transitional. Space-separated paths of the repository's previous
          layout (".", "debian", "dists/bookworm", "usdr.gpg") to copy, frozen,
          from the live site into this deploy so clients configured the old way
          keep working while they are moved; "old=new" serves the live file
          "new" under the old path "old". See docs/conventions.md.
        required: false
        default: ""
        type: string
      size-limit-mb:
        description: >-
          Earlier package versions are kept from the live site, oldest dropped
          first, while the whole site stays under this many MB (GitHub Pages
          allows 1 GB). 0 keeps only the new build. See docs/conventions.md.
        required: false
        default: 900
        type: number
      artifact-pattern:
        description: Shell-style glob matching the caller's deb artifacts.
        required: false
        default: "debs-*"
        type: string
    secrets:
      gpg-private-key:
        description: ASCII-armoured private signing key for this repository.
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The caller's `if:` should already stop these (docs/packaging.md,
      # "Workflows"), but one wrong guard would overwrite a live repository
      # with unreviewed packages, so the publisher checks too. A reusable
      # workflow sees the caller's event and ref.
      - name: Publish only from the default branch
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$EVENT" in
            pull_request|pull_request_target)
              echo "::error::refusing to publish from a pull request. Give publish-apt: if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch"
              exit 1 ;;
          esac
          # From the API, not the event payload, so it doesn't depend on which
          # fields each kind of event's payload carries.
          default=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          if [ "$REF" != "refs/heads/$default" ]; then
            echo "::error::refusing to publish from $REF: only the default branch ($default) publishes"
            exit 1
          fi

      - uses: actions/checkout@v5

      # The action and scripts at the same commit as this workflow file, so a
      # caller pinned to a branch or SHA gets one consistent version of all
      # three. job.workflow_sha is the commit of the file defining this job.
      - name: Check out this workflow's own apt-repo-action
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .apt-repo-action

      # One directory per suite from the debs-<suite>[-<arch>...] artifacts.
      - name: Collect the deb artifacts into apt-repo/<suite>/
        uses: ./.apt-repo-action/collect-debs
        with:
          suites: ${{ inputs.suites }}
          pattern: ${{ inputs.artifact-pattern }}
          dest: apt-repo

      # The packages ours need from dependency repositories declared with
      # `bundle` (docs/packaging.md, "Bundling a dependency repository"),
      # verified against their signed indexes, so users add only this
      # repository. Before keep-history, so the size limit counts them and
      # their earlier versions are kept like ours. Nothing declared: nothing
      # happens. A dependency that can't be fetched and verified fails the
      # publish, rather than publishing packages that can't be installed.
      - name: Bundle packages from dependency repositories
        shell: bash
        env:
          SUITES: ${{ inputs.suites }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for suite in $SUITES; do
            python3 .apt-repo-action/scripts/bundle-depends.py fetch \
              --suite "$suite" --debs "apt-repo/$suite" | tee -a bundled.txt
          done
          if [ -s bundled.txt ]; then
            { echo "### Bundled from dependency repositories"; echo '```'; cat bundled.txt; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f bundled.txt

      - name: Find the caller's index page fragment
        id: intro
        shell: bash
        run: |
          set -eu
          # Every index page comes from one template (docs/conventions.md); a
          # repository adds prose through packaging/apt-intro.html.
          for cand in packaging/apt-index.html docs/apt-index.html apt-index.html; do
            if [ -f "$cand" ]; then
              echo "::warning::$cand is ignored: index pages are generated. Move its description into packaging/apt-intro.html"
            fi
          done
          if [ -f packaging/apt-intro.html ]; then
            echo "path=packaging/apt-intro.html" >> "$GITHUB_OUTPUT"
          fi

      - id: pages
        uses: actions/configure-pages@v6

      - name: Keep earlier versions within the size limit
        if: inputs.size-limit-mb > 0
        shell: bash
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
          SUITES: ${{ inputs.suites }}
          LIMIT_MB: ${{ inputs.size-limit-mb }}
          LEGACY_PATHS: ${{ inputs.legacy-paths }}
        run: |
          set -eu
          # Leave room for what later steps add: the index files and pages
          # (generously 20 MB) and any legacy-paths copy.
          reserve=20000000
          if [ -n "$LEGACY_PATHS" ]; then
            # shellcheck disable=SC2086 # word splitting is the point
            legacy=$(python3 .apt-repo-action/scripts/carry-over.py --measure \
              --site "$SITE" --dest apt-repo $LEGACY_PATHS)
            reserve=$((reserve + legacy))
          fi
          python3 .apt-repo-action/scripts/keep-history.py --site "$SITE" \
            --dest apt-repo --suites "$SUITES" \
            --limit-bytes $((LIMIT_MB * 1000000)) --reserve-bytes "$reserve"

      - name: Index and sign
        uses: ./.apt-repo-action
        with:
          apt-root: apt-repo
          suites: ${{ inputs.suites }}
          architectures: ${{ inputs.architectures }}
          origin: ${{ inputs.origin }}
          description: ${{ inputs.description }}
          keyring-name: ${{ inputs.keyring-name }}
          site-url: ${{ steps.pages.outputs.base_url }}
          intro-html: ${{ steps.intro.outputs.path }}
          gpg-private-key: ${{ secrets.gpg-private-key }}

      - name: Keep serving the previous layout while clients move
        if: inputs.legacy-paths != ''
        shell: bash
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
          LEGACY_PATHS: ${{ inputs.legacy-paths }}
        run: |
          set -eu
          # shellcheck disable=SC2086 # word splitting is the point
          python3 .apt-repo-action/scripts/carry-over.py \
            --site "$SITE" --dest apt-repo $LEGACY_PATHS

      - name: Site size
        shell: bash
        run: |
          set -eu
          bytes=$(du -sb apt-repo | cut -f1)
          echo "deploying $((bytes / 1000000)) MB"
          if [ "$bytes" -gt 1000000000 ]; then
            echo "::warning::the site is $((bytes / 1000000)) MB; GitHub Pages allows 1 GB"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apt-repo/
          # v4 and later leave out dotfiles unless asked; v3 kept them.
          include-hidden-files: true

      - id: deploy
        uses: actions/deploy-pages@v5
